services:
  - type: web
    name: appfndedowelever
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.address 0.0.0.0 --server.port $PORT
    envVars:
      - key: STORAGE_BACKEND
        value: local
      - key: FNDE_TIMEOUT
        value: 60
